name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Project Setup
        run: |
          cd frontend
          npm install
          npm start &

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          claude_args: |
            --system-prompt "You are assisting with the Feedly Helper project. The frontend is a React app (Create React App) running at http://localhost:3001. It has a single Fetch button that calls the backend Lambda API to retrieve unread Feedly articles, then displays them as a clickable list. Use Playwright MCP tools to navigate, inspect, and interact with the UI when visual verification is needed."
            --mcp-config .github/playwright-mcp-config.json
            --allowed-tools Bash,Read,Write,Edit,Glob,Grep,mcp__playwright__browser_navigate,mcp__playwright__browser_navigate_back,mcp__playwright__browser_snapshot,mcp__playwright__browser_click,mcp__playwright__browser_take_screenshot,mcp__playwright__browser_wait_for,mcp__playwright__browser_type,mcp__playwright__browser_fill_form,mcp__playwright__browser_evaluate,mcp__playwright__browser_hover,mcp__playwright__browser_drag,mcp__playwright__browser_select_option,mcp__playwright__browser_console_messages,mcp__playwright__browser_network_requests,mcp__playwright__browser_press_key,mcp__playwright__browser_handle_dialog,mcp__playwright__browser_resize,mcp__playwright__browser_tabs,mcp__playwright__browser_file_upload,mcp__playwright__browser_run_code,mcp__playwright__browser_close,mcp__playwright__browser_install

